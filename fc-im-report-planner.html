<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FranConnect IM Report Planner</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --fc:#185FA5;--fc-mid:#378ADD;--fc-light:#E6F1FB;--fc-border:#B5D4F4;--fc-dark:#0C447C;
  --bg:#F5F7FA;--surface:#fff;--border:#E2E8F0;--border-strong:#CBD5E1;
  --text:#1E293B;--muted:#64748B;--hint:#94A3B8;
  --green-bg:#EAF3DE;--green-text:#3B6D11;--green-border:#C0DD97;
  --amber-bg:#FAEEDA;--amber-text:#854F0B;--amber-border:#FAC775;
  --red-bg:#FEE2E2;--red-text:#B91C1C;--red-border:#FCA5A5;
  --r:10px;--rs:6px;--rp:999px;
}
body{font-family:"DM Sans",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:2rem 1rem}
.page{max-width:820px;margin:0 auto}
.hdr{display:flex;align-items:center;gap:12px;margin-bottom:2rem}
.logo{background:var(--fc);color:#fff;font-size:11px;font-weight:600;letter-spacing:.08em;padding:5px 12px;border-radius:var(--rs);text-transform:uppercase;flex-shrink:0}
.hdr-title{font-size:20px;font-weight:600}
.hdr-sub{font-size:13px;color:var(--muted);margin-top:1px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.25rem 1.5rem;margin-bottom:1rem}
.card-title{font-size:15px;font-weight:600;margin-bottom:.4rem}
.help{background:var(--fc-light);border-left:3px solid var(--fc-mid);border-radius:0 var(--rs) var(--rs) 0;padding:9px 13px;font-size:13px;color:var(--fc-dark);line-height:1.6;margin:.6rem 0 1rem}
.help strong{font-weight:600}
.tip{background:#FAFAFA;border:1px solid var(--border);border-radius:var(--rs);padding:8px 12px;font-size:12px;color:var(--muted);line-height:1.55;margin-top:8px}
textarea,input[type=text],select{font-family:"DM Sans",sans-serif;font-size:14px;color:var(--text);background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--rs);padding:7px 10px;width:100%;transition:border-color .15s}
textarea:focus,input[type=text]:focus,select:focus{outline:none;border-color:var(--fc-mid);box-shadow:0 0 0 3px rgba(55,138,221,.1)}
textarea{resize:vertical;line-height:1.55}
.btn{font-family:"DM Sans",sans-serif;font-size:14px;font-weight:500;border-radius:var(--rs);padding:8px 18px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--fc);color:#fff;border-color:var(--fc)}
.btn-primary:hover{background:var(--fc-dark)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--muted);border-color:var(--border-strong)}
.btn-ghost:hover{background:var(--bg);color:var(--text)}
.btn-sm{font-size:13px;padding:6px 12px}
.add-btn{font-size:13px;color:var(--fc);background:none;border:1px dashed var(--fc-mid);border-radius:var(--rs);padding:7px 12px;cursor:pointer;width:100%;text-align:left;font-family:"DM Sans",sans-serif;display:flex;align-items:center;gap:5px;margin-top:4px}
.add-btn:hover{background:var(--fc-light)}
.rmv{background:none;border:none;cursor:pointer;color:var(--hint);font-size:18px;line-height:1;padding:0;flex-shrink:0}
.rmv:hover{color:#E24B4A}
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:1rem}
.sec-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}
.pill{display:inline-block;background:var(--fc-light);color:var(--fc-dark);border-radius:var(--rp);padding:3px 9px;font-size:12px;margin:2px 3px 2px 0;border:1px solid var(--fc-border)}
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:3px 9px;border-radius:var(--rp)}
.badge-tab{background:var(--green-bg);color:var(--green-text);border:1px solid var(--green-border)}
.badge-agg{background:var(--amber-bg);color:var(--amber-text);border:1px solid var(--amber-border)}
.loading{padding:3rem;display:flex;flex-direction:column;align-items:center;gap:.85rem;color:var(--muted);font-size:14px;justify-content:center}
.spinner{width:22px;height:22px;border:2.5px solid var(--border-strong);border-top-color:var(--fc);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.mockup-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:1rem}
.mockup-bar{background:var(--fc);color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between}
.mockup-bar-name{font-size:14px;font-weight:600}
.mockup-bar-meta{font-size:11px;opacity:.7}
.mock-filter-bar{background:#F8FAFB;border-bottom:1px solid var(--border);padding:7px 14px;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.mock-filter-chip{background:var(--fc-light);color:var(--fc-dark);border:1px solid var(--fc-border);border-radius:var(--rp);padding:2px 9px;font-size:11px}
.mock-table-wrap{overflow-x:auto}
table.mock-table{width:100%;border-collapse:collapse;font-size:13px}
table.mock-table th{background:#F8FAFB;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:9px 14px;border-bottom:2px solid var(--border);text-align:left;white-space:nowrap}
table.mock-table th .th-tab{display:block;font-size:10px;font-weight:400;color:var(--hint);text-transform:none;letter-spacing:0;margin-top:1px}
table.mock-table td{padding:9px 14px;border-bottom:1px solid var(--border);color:var(--hint);white-space:nowrap;font-size:12px;font-style:italic}
table.mock-table tr:nth-child(even) td{background:#FAFBFC}
table.mock-table tr:last-child td{border-bottom:none}
.mock-footer{padding:8px 14px;font-size:12px;color:var(--muted);border-top:1px solid var(--border);background:#FAFAFA}
.agg-chart{padding:1.25rem 1.5rem}
.agg-chart-title{font-size:13px;font-weight:600;margin-bottom:1rem}
.bar-row{display:grid;grid-template-columns:160px 1fr 50px;gap:10px;align-items:center;margin-bottom:7px}
.bar-label{font-size:12px;color:var(--text);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{background:#F1F5F9;border-radius:var(--rp);height:20px;overflow:hidden}
.bar-fill{background:var(--fc-mid);height:100%;border-radius:var(--rp)}
.bar-val{font-size:12px;color:var(--muted);font-family:"DM Mono",monospace}
/* Tab limit indicator */
.tab-meter{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--rs);font-size:13px;margin-bottom:1rem;border:1px solid var(--border)}
.tab-meter.ok{background:var(--green-bg);border-color:var(--green-border);color:var(--green-text)}
.tab-meter.warn{background:var(--amber-bg);border-color:var(--amber-border);color:var(--amber-text)}
.tab-meter.full{background:var(--red-bg);border-color:var(--red-border);color:var(--red-text)}
.tab-dots{display:flex;gap:4px}
.tab-dot{width:14px;height:14px;border-radius:50%;border:1.5px solid currentColor;transition:background .15s}
.tab-dot.used{background:currentColor}
/* Tab browser */
.tab-browser{display:grid;grid-template-columns:200px 1fr;gap:0;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;max-height:420px}
.tab-list{border-right:1px solid var(--border);overflow-y:auto;background:#FAFAFA}
.tab-list-item{padding:8px 14px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--border);color:var(--muted);transition:all .12s;display:flex;justify-content:space-between;align-items:center}
.tab-list-item:hover{background:var(--fc-light);color:var(--fc-dark)}
.tab-list-item.active{background:var(--fc);color:#fff;font-weight:500}
.tab-list-item .tab-count{font-size:11px;opacity:.7}
.tab-fields{overflow-y:auto;padding:.75rem}
.section-group{margin-bottom:.85rem}
.section-name{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.field-chips{display:flex;flex-wrap:wrap;gap:5px}
.field-chip{font-size:12px;padding:3px 10px;border:1px solid var(--border-strong);border-radius:var(--rp);cursor:pointer;color:var(--muted);background:var(--surface);transition:all .12s;display:flex;align-items:center;gap:4px}
.field-chip:hover{background:var(--fc-light);border-color:var(--fc-mid);color:var(--fc-dark)}
.field-chip.selected{background:var(--fc);color:#fff;border-color:var(--fc)}
.field-chip .fc-type{font-size:10px;opacity:.7}
/* Review columns */
.col-row{display:grid;grid-template-columns:1fr 130px 26px;gap:6px;align-items:center;margin-bottom:5px}
.col-tab-badge{font-size:11px;padding:2px 8px;border-radius:var(--rp);background:var(--fc-light);color:var(--fc-dark);border:1px solid var(--fc-border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
/* Filter rows */
.filter-row-wrap{background:#F8FAFB;border:1px solid var(--border);border-radius:var(--rs);padding:9px 11px;margin-bottom:7px}
.filter-row-wrap.warn{background:#FFFBF0;border-color:var(--amber-border)}
.filter-grid{display:grid;grid-template-columns:1fr 140px 1fr 26px;gap:5px;align-items:center}
.filter-grid select,.filter-grid input[type=text]{font-size:12px;padding:6px 8px}
/* Briefing */
.briefing{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-top:.75rem}
.bf-header{background:var(--fc);color:#fff;padding:12px 18px;border-radius:0}
.bf-header-name{font-size:15px;font-weight:600}
.bf-header-meta{font-size:12px;opacity:.8;margin-top:3px;display:flex;gap:12px;flex-wrap:wrap}
.bf-body{padding:1rem 1.25rem;display:flex;flex-direction:column;gap:1rem}
.bf-section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:.5rem;display:flex;align-items:center;gap:6px}
.bf-section-title::after{content:"";flex:1;height:1px;background:var(--border)}
.bf-col-item{display:flex;align-items:baseline;gap:8px;margin-bottom:3px}
.bf-col-num{font-size:11px;color:var(--hint);font-family:"DM Mono",monospace;width:18px;text-align:right;flex-shrink:0}
.bf-col-name{font-size:13px;font-weight:500;color:var(--text)}
.bf-col-tab{font-size:11px;color:var(--hint);margin-left:2px}
.bf-tab-groups{display:flex;flex-direction:column;gap:6px}
.bf-tab-group{background:#F8FAFB;border:1px solid var(--border);border-radius:var(--rs);padding:8px 12px}
.bf-tab-group-name{font-size:12px;font-weight:600;color:var(--fc-dark);margin-bottom:4px}
.bf-tab-group-fields{font-size:12px;color:var(--muted);line-height:1.6}
.bf-filter-card{background:#F8FAFB;border:1px solid var(--border);border-radius:var(--rs);padding:9px 12px;margin-bottom:6px}
.bf-filter-card.warn{background:#FFFBF0;border-color:var(--amber-border)}
.bf-filter-row{display:grid;grid-template-columns:80px 1fr;gap:4px;font-size:12px;margin-bottom:2px}
.bf-filter-label{font-weight:600;color:var(--muted);text-transform:uppercase;font-size:10px;letter-spacing:.05em}
.bf-filter-val{font-family:"DM Mono",monospace;font-size:12px}
.bf-step{display:flex;gap:10px;align-items:flex-start;margin-bottom:5px}
.bf-step-num{width:20px;height:20px;border-radius:50%;background:var(--fc);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.bf-step-text{font-size:13px;line-height:1.5}
.bf-note{background:var(--fc-light);border:1px solid var(--fc-border);border-radius:var(--rs);padding:8px 12px;font-size:12px;color:var(--fc-dark);line-height:1.55}
.bf-warn-msg{font-size:11px;color:var(--amber-text);display:flex;gap:5px;margin-top:3px}
.copy-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--fc);background:none;border:1px solid var(--fc-border);border-radius:var(--rs);padding:6px 14px;cursor:pointer;margin-top:8px;font-family:"DM Sans",sans-serif;font-weight:500}
.copy-btn:hover{background:var(--fc-light)}
.chip{font-size:12px;padding:4px 11px;border:1px solid var(--border-strong);border-radius:var(--rp);cursor:pointer;color:var(--muted);background:var(--surface);transition:all .12s}
.chip:hover{background:var(--fc-light);border-color:var(--fc-mid);color:var(--fc-dark)}

.col-status{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.col-status-ok{background:var(--green-bg);color:var(--green-text);border:1px solid var(--green-border)}
.col-status-warn{background:var(--amber-bg);color:var(--amber-text);border:1px solid var(--amber-border)}
.col-status-unknown{background:var(--red-bg);color:var(--red-text);border:1px solid var(--red-border)}
.col-suggestion{font-size:11px;color:var(--amber-text);margin-top:3px;padding:3px 8px;background:var(--amber-bg);border-radius:var(--rs);border:1px solid var(--amber-border);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.col-suggestion button{font-size:11px;color:var(--fc);background:none;border:none;cursor:pointer;padding:0;font-family:inherit;font-weight:500;text-decoration:underline}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>

- Insurance: Insurance policy tracking — Expiration Date, Policy Number, Insurance Type, coverage fields, agency contact.

- Transfer: Ownership transfer records — Transfer Type, Closing Date, Buyer/Seller signers, Transfer Fee Amount.
- Entity Detail: Legal entity info — Legal Entity Name, Store Name/DBA, Entity Type, Taxpayer ID/FEIN.
- Guarantor: Guarantor details — First/Last Name, Email, Phone, Percentage, Taxpayer ID.
- Territory: Territory details — Type of Territory, Zip codes, Area Size, Geographic Coordinates.

function getTabsUsed(columns) {
  const tabs = new Set((columns||[]).map(c=>c.tab).filter(Boolean));
  return tabs;
}

function tabMeterHTML(tabsUsed) {
  const n = tabsUsed.size;
  const cls = n >= 5 ? "full" : n >= 4 ? "warn" : "ok";
  const msg = n === 0 ? "No tabs selected yet"
    : n >= 5 ? `${n}/5 tabs used — at the limit. Adding fields from a new tab won't work.`
    : n >= 4 ? `${n}/5 tabs used — one more tab available.`
    : `${n}/5 tabs used`;
  const dots = Array.from({length:5}, (_,i) =>
    `<div class="tab-dot ${i<n?'used':''}" title="${i<n?[...tabsUsed][i]:''}"></div>`
  ).join("");
  return `<div class="tab-meter ${cls}">
    <div class="tab-dots">${dots}</div>
    <span>${msg}</span>
    ${n>0 ? `<span style="font-size:11px;opacity:.8">${[...tabsUsed].join(", ")}</span>` : ""}
  </div>`;
}

// ── File upload handling ──────────────────────────────────────────────────────
async function handleFileSelect(file) { if (file) await processFile(file); }
async function handleFileDrop(file) { if (file) await processFile(file); }

async function processFile(file) {
  const name = file.name;
  const ext = name.split('.').pop().toLowerCase();
  const imageTypes = ['png','jpg','jpeg','gif','webp'];
  const mediaTypeMap = {'png':'image/png','jpg':'image/jpeg','jpeg':'image/jpeg','gif':'image/gif','webp':'image/webp'};

  const dz = document.getElementById('dropZone');
  if (dz) dz.innerHTML = '<div style="font-size:13px;color:var(--muted)">Reading file&hellip;</div>';

  try {
    if (imageTypes.includes(ext)) {
      const b64 = await fileToBase64(file);
      S.uploadContent = {type:'image', data:b64, mediaType:mediaTypeMap[ext]||'image/png', fileName:name};

    } else if (ext === 'pdf') {
      const b64 = await fileToBase64(file);
      S.uploadContent = {type:'document', data:b64, mediaType:'application/pdf', fileName:name};

    } else if (['xlsx','xls'].includes(ext)) {
      const text = await readExcelAsText(file);
      S.uploadContent = {type:'text', data:text, fileName:name};

    } else if (ext === 'csv') {
      const text = await readTextFile(file);
      S.uploadContent = {type:'text', data:text, fileName:name};

    } else if (['docx','doc'].includes(ext)) {
      const text = await readDocxAsText(file);
      S.uploadContent = {type:'text', data:text, fileName:name};

    } else {
      const text = await readTextFile(file);
      S.uploadContent = {type:'text', data:text, fileName:name};
    }
  } catch(e) {

async function readExcelAsText(file) {
  // Use SheetJS if available, otherwise fall back to CSV-like extraction
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = (e) => {
      try {
        if (window.XLSX) {
          const wb = XLSX.read(e.target.result, {type:'array'});
          let out = '';
          wb.SheetNames.forEach(sname => {
            const ws = wb.Sheets[sname];
            out += `Sheet: ${sname}\n` + XLSX.utils.sheet_to_csv(ws) + '\n\n';
          });
          resolve(out.slice(0, 12000));
        } else {
          // Fallback: extract printable ASCII strings from binary
          const arr = new Uint8Array(e.target.result);
          let text = '', current = '';
          for (let i = 0; i < arr.length; i++) {
            const c = arr[i];
            if (c >= 32 && c < 127) { current += String.fromCharCode(c); }
            else { if (current.length > 3) text += current + '\t'; current = ''; }
          }
          resolve(text.slice(0, 12000));
        }
      } catch(err) { reject(err); }
    };
    r.onerror = reject;
    r.readAsArrayBuffer(file);
  });
}

async function readDocxAsText(file) {
  // DOCX is a ZIP — extract word/document.xml and strip tags
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = async (e) => {
      try {
        // Use JSZip if available
        if (window.JSZip) {
          const zip = await JSZip.loadAsync(e.target.result);
          const xmlFile = zip.file('word/document.xml');
          if (!xmlFile) { resolve('(could not read document.xml)'); return; }
          const xml = await xmlFile.async('string');
          // Strip XML tags, decode common entities, collapse whitespace
          const text = xml
            .replace(/<w:p[ >]/g, '\n<w:p>')   // paragraph breaks
            .replace(/<[^>]+>/g, '')            // strip all tags
            .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>')
            .replace(/&nbsp;/g,' ').replace(/&#x[0-9A-F]+;/gi,'')
            .replace(/[ \t]+/g,' ')
            .trim();
          resolve(text.slice(0, 12000));
        } else {
          // Fallback: read as binary and extract text runs
          const arr = new Uint8Array(e.target.result);
          // Look for UTF-16 text between XML tags in the ZIP
          let text = '';
          const decoder = new TextDecoder('utf-8', {fatal:false});
          // Try reading as UTF-8 and stripping tags
          const raw = decoder.decode(arr);
          const stripped = raw.replace(/<[^>]+>/g,'').replace(/[^\x20-\x7E\n]/g,' ').replace(/\s+/g,' ');
          resolve(stripped.slice(0, 12000));
        }
      } catch(err) { reject(err); }
    };
    r.onerror = reject;
    r.readAsArrayBuffer(file);
  });

// ── IM Field validation ───────────────────────────────────────────────────────
function getIMFieldList() {
  const list = [];
  Object.entries(IM_FIELD_DICT).forEach(([tab, sections]) => {
    Object.entries(sections).forEach(([section, fields]) => {
      fields.forEach(f => list.push({name:f.name, tab, section}));
    });
  });
  return list;
}

function fuzzyMatchIM(fieldName) {
  if (!fieldName) return null;
  // Alias map — common names that map to exact field names
  const ALIASES = {
    'franchise id': 'Franchise ID',
    'muid': 'Franchise ID',
    'franchise id/muid': 'Franchise ID',
    'franchise id / muid': 'Franchise ID',
    'location id': 'Franchise ID',
    'store id': 'Franchise ID',
    'center id': 'Franchise ID',
    'store number': 'License Number',
    'location number': 'License Number',
    'contract status': 'Contract Status',
    'expiration date': 'Term Expiration Date',
    'lease expiry': 'Lease Expiration Date',
    'owner email': 'Email',
    'franchisee email': 'Email',
  };
  const aliasMatch = ALIASES[fieldName.toLowerCase().trim()];
  if (aliasMatch) {
    const list = getIMFieldList();
    const found = list.find(f => f.name === aliasMatch);
    if (found) return {match: found, score: 1.0};
  }
  const list = getIMFieldList();
  const q = fieldName.toLowerCase().trim();
  const exact = list.find(f => f.name.toLowerCase() === q);
  if (exact) return {match:exact, score:1.0};
  const contains = list.filter(f => f.name.toLowerCase().includes(q) || q.includes(f.name.toLowerCase()));
  if (contains.length) return {match:contains[0], score:0.8};
  const qWords = q.split(/\s+/);
  let best = null, bestScore = 0;
  list.forEach(f => {
    const fWords = f.name.toLowerCase().split(/\s+/);
    const overlap = qWords.filter(w => w.length>2 && fWords.some(fw => fw.includes(w)||w.includes(fw))).length;
    const score = overlap / Math.max(qWords.length, fWords.length);
    if (score > bestScore) { bestScore = score; best = f; }
  });
  if (bestScore > 0.3) return {match:best, score:bestScore};
  return null;
}

function getIMColStatus(col) {
  const list = getIMFieldList();
  const exact = list.find(f => f.name.toLowerCase() === (col.name||"").toLowerCase().trim());
  if (exact) return {status:"ok", suggestion:null};
  if (col.confident === false) {
    const fm = fuzzyMatchIM(col.name);
    return {status:"warn", suggestion: fm ? fm.match : null};
  }
  const fm = fuzzyMatchIM(col.name);
  if (!fm || fm.score < 0.5) return {status:"unknown", suggestion: fm ? fm.match : null};
  return {status:"ok", suggestion:null};
}

function colRow(col, i) {

        messages:[{role:"user",content:`Generate realistic franchise IM aggregate report data. Group by: "${gb.field}" (tab: ${gb.tab}). Return JSON: {"rows":[{"label":"...","count":42},...], "maxCount":123}. Use 5-8 rows with realistic franchise location values.`}]})});
    const data=await res.json();
    const raw=(data.content?.find(b=>b.type==="text")?.text||"{}").replace(/```[a-z]*|```/g,"").trim();
    return {type:"aggregate",...JSON.parse(raw)};
  } catch(e) { return {type:"aggregate",rows:[{label:"(preview unavailable)",count:0}],maxCount:1}; }
}

function buildBriefing(isAgg, spec) {
  const name = spec.reportName||"[name your report]";
  const cols = spec.columns||[];
  const filters = spec.filters||[];
  const tabsUsed = getTabsUsed(cols);

  // Group columns by tab for the briefing
  const colsByTab = {};
  cols.forEach(c => {
    if (!c.name) return;
    if (!colsByTab[c.tab||"Unknown"]) colsByTab[c.tab||"Unknown"]=[];
    colsByTab[c.tab||"Unknown"].push(c);
  });

  let out = `<div class="briefing">
    <div class="bf-header">
      <div class="bf-header-name">${esc(name)}</div>
      <div class="bf-header-meta">
        <span>Information Manager</span>
        <span>${isAgg?"Aggregate &mdash; count":"Tabular &mdash; list"}</span>
        ${tabsUsed.size>0?`<span>${tabsUsed.size}/5 tabs</span>`:""}
      </div>
    </div>
    <div class="bf-body">`;

  // Summary
  out += `<div>
    <div class="bf-section-title">Summary</div>
    ${S.description?`<div style="font-size:13px;color:var(--muted);font-style:italic;margin-bottom:6px">&ldquo;${esc(S.description)}&rdquo;</div>`:""}
    <div style="font-size:13px"><strong>Type:</strong> ${isAgg?"Aggregate (count)":"Tabular (list of locations)"}</div>
    ${spec.tabWarning?`<div style="font-size:12px;color:var(--amber-text);margin-top:4px">&#9888; ${esc(spec.tabWarning)}</div>`:""}
  </div>`;

  // Columns or group by
  if (isAgg) {
    const gb=spec.groupBy||{};
    out += `<div>
      <div class="bf-section-title">Count / Group By</div>
      <div style="font-size:13px"><strong>Field:</strong> ${esc(gb.field||"[not set]")}</div>
      <div style="font-size:12px;color:var(--muted);margin-top:2px">Tab: ${esc(gb.tab||"")}</div>
      <div class="bf-note" style="margin-top:8px">Find this under &ldquo;Choose Field to Group By&rdquo; in the report builder. IM will count how many locations share each value of this field.</div>
    </div>`;
  } else {
    out += `<div>
      <div class="bf-section-title">Columns (${cols.length}) &mdash; ${tabsUsed.size}/5 tabs</div>
      <div class="bf-tab-groups">
        ${Object.entries(colsByTab).map(([tab,tcols])=>`
        <div class="bf-tab-group">
          <div class="bf-tab-group-name">&#128196; ${esc(tab)}</div>
          <div class="bf-tab-group-fields">${tcols.map((c,i)=>`${i+1}. ${esc(c.name)}${c.section?" <em>("+esc(c.section)+")</em>":""}`).join(" &nbsp;&bull;&nbsp; ")}</div>
        </div>`).join("")}
      </div>
      <div class="bf-note" style="margin-top:10px">
        <strong>How to add fields in FranConnect:</strong><br>
        Use the field picker and navigate to each tab listed above. Type the field name to search quickly. After adding, drag fields into order using the 4-arrow handle. Check &ldquo;sortable&rdquo; on any field you may want to sort by later.
      </div>
    </div>`;
  }

  // Filters
  out += `<div><div class="bf-section-title">Filters</div>`;
  if (!filters.length) {
    out += `<div style="font-size:13px;color:var(--muted);font-style:italic">None &mdash; report will include all locations.</div>`;
  } else {
    out += `<div style="font-size:12px;color:var(--muted);margin-bottom:.6rem">All filters use <strong>AND logic</strong> &mdash; each row must be true for a location to appear. Add each as a separate row in FranConnect&rsquo;s filter builder.</div>`;
    filters.forEach((f,i) => {
      const noVal=["is empty","is not empty","is in this month","is in last month","is in this year","is in last year","is in the last 7 days"].includes(f.operator);
      out += `<div class="bf-filter-card ${f.warning||!f.confident?'warn':''}">
        <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px">Filter ${i+1}</div>
        <div class="bf-filter-row"><span class="bf-filter-label">Field</span><span class="bf-filter-val">${esc(f.field)}</span></div>
        ${f.tab?`<div class="bf-filter-row"><span class="bf-filter-label">Tab</span><span class="bf-filter-val">${esc(f.tab)}</span></div>`:""}
        <div class="bf-filter-row"><span class="bf-filter-label">Operator</span><span class="bf-filter-val">${esc(f.operator)}</span></div>
        ${!noVal&&f.value?`<div class="bf-filter-row"><span class="bf-filter-label">Value</span><span class="bf-filter-val">${esc(f.value)}</span></div>`:""}
        ${f.warning?`<div class="bf-warn-msg"><span>&#9888;</span><span>${esc(f.warning)}</span></div>`:""}
        ${!f.confident?`<div class="bf-warn-msg"><span>&#9888;</span><span>Uncertain match &mdash; verify this field in FranConnect.</span></div>`:""}
      </div>`;
      if (i<filters.length-1) out+=`<div style="font-size:11px;color:var(--hint);text-align:center;padding:2px 0;font-style:italic">AND</div>`;
    });
  }
  out += `</div>`;

  // Build steps
  const steps = [
    "Go to the <strong>Information Manager</strong> module",
    "Open <strong>Reports</strong> (or Analytics menu)",
    "Click <strong>Create New Report</strong>",
    `Choose <strong>${isAgg?"Aggregation":"Tabular"}</strong> &rarr; Next`,
    `Name it: <strong>${esc(name)}</strong>`,
    "Set visibility &mdash; <strong>Private</strong> is recommended unless sharing",
    filters.length?"Add your filters &mdash; see filter cards above (AND logic, one row per filter)":"Skip filters &mdash; report will include all locations",
  ];
  if (isAgg) {
    steps.push("Select a chart type (bar, line, pie, or overlay)");
    steps.push(`Under <strong>Choose Field to Group By</strong>, select: <strong>${esc((spec.groupBy||{}).field||"[your field]")}</strong>`);
    steps.push("Under <strong>Choose Display Summaries</strong>, select <strong>Count</strong>");
  } else {
    steps.push("Add your columns using the field picker &mdash; navigate to each tab listed above");
    steps.push("<strong>5-tab limit:</strong> IM allows fields from up to 5 tabs per report. You are using "+tabsUsed.size+" tab"+(tabsUsed.size===1?"":"s")+".");
  }
  steps.push(`Click <strong>Modify</strong> to save &mdash; <em>(the button says &ldquo;Modify&rdquo;, not &ldquo;Save&rdquo; &mdash; that is correct)</em>`);

  out += `<div><div class="bf-section-title">How to Build in FranConnect</div>
    ${steps.map((s,i)=>`<div class="bf-step"><div class="bf-step-num">${i+1}</div><div class="bf-step-text">${s}</div></div>`).join("")}
  </div>`;

  // Notes
  out += `<div><div class="bf-section-title">Good to Know</div>
    <div class="bf-note"><ul style="padding-left:1.1rem;margin:0;display:flex;flex-direction:column;gap:3px">
      <li><strong>5-tab limit:</strong> IM reports can pull from a maximum of 5 tabs. Plan your columns accordingly.</li>
      <li><strong>Status &amp; dropdown values</strong> are customized per account &mdash; verify exact values in your FranConnect before using them as filter values.</li>
      <li><strong>Custom fields</strong> appear in the field picker just like standard fields &mdash; use the exact label from a real location record.</li>
      <li><strong>Center Info is usually Tab 1</strong> &mdash; it provides the location identity fields (name, status, region) that anchor most reports.</li>
    </ul></div>
  </div>`;

  out += `</div></div>`;
  return out;
}

// ── STEP 5: Mockup + briefing ─────────────────────────────────────────────────
function vMockup() {
  const spec=S.spec||{}; const isAgg=spec.reportType==="aggregate";
  const name=spec.reportName||"My IM Report"; const data=S.mockupData;
  const filters=(spec.filters||[]).filter(f=>f.field);
  const tabsUsed=getTabsUsed(spec.columns);

  let mockHtml="";
  if (!data) {
    mockHtml=`<div class="loading"><div class="spinner"></div></div>`;
  } else if (isAgg) {
    const rows=data.rows||[]; const max=data.maxCount||Math.max(...rows.map(r=>r.count),1);
    mockHtml=`<div class="agg-chart">
      <div class="agg-chart-title">Count by ${esc((spec.groupBy||{}).field||"")}</div>
      ${rows.map(r=>`<div class="bar-row">
        <div class="bar-label" title="${esc(r.label)}">${esc(r.label)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round(r.count/max*100)}%"></div></div>
        <div class="bar-val">${r.count}</div>
      </div>`).join("")}
      <div style="font-size:11px;color:var(--hint);margin-top:1rem">Sample data &mdash; for planning only</div>
    </div>`;
  } else {
    const cols=data.columns||[];
    const filterBar=filters.length?`<div class="mock-filter-bar">Filtered by: ${filters.map(f=>`<span class="mock-filter-chip">${esc(f.field)} ${esc(f.operator)}${f.value?' &ldquo;'+esc(f.value)+'&rdquo;':""}</span>`).join(" ")}</div>`:"";
    mockHtml=filterBar+`<div class="mock-table-wrap"><table class="mock-table"><thead><tr>
      ${cols.map(c=>`<th>${esc(c.name)}<span class="th-tab">${esc(c.tab||"")}</span></th>`).join("")}
    </tr></thead><tbody>
      ${Array(5).fill(null).map(()=>`<tr>${cols.map(()=>"<td>&mdash; your data &mdash;</td>").join("")}</tr>`).join("")}
    </tbody></table></div>
    <div class="mock-footer">Column headers are yours &mdash; rows show where your real location data will appear. Tab shown in grey under each column header.</div>`;
  }

  return `
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem;flex-wrap:wrap;gap:8px">
    <div>
      <div style="font-size:16px;font-weight:600">Your report</div>
      <div style="font-size:13px;color:var(--muted);margin-top:2px">Use the briefing below to build this in FranConnect.</div>
    </div>
    <div style="display:flex;gap:7px">
      <button class="btn btn-ghost btn-sm" onclick="S.view='review';render()">&larr; Edit spec</button>
      <button class="btn btn-ghost btn-sm" onclick="resetAll()">Start over</button>
    </div>
  </div>

  ${tabMeterHTML(tabsUsed)}

  <div class="mockup-wrap">
    <div class="mockup-bar">
      <span class="mockup-bar-name">${esc(name)}</span>
      <span class="mockup-bar-meta">Information Manager &middot; ${isAgg?"Aggregate &middot; Sample data":"Tabular &middot; Column preview"} &middot; ${tabsUsed.size}/5 tabs</span>
    </div>
    ${mockHtml}
  </div>

  <div style="display:flex;gap:7px;margin-bottom:1rem;flex-wrap:wrap;align-items:center">
    <span class="badge ${isAgg?"badge-agg":"badge-tab"}">${isAgg?"Aggregate":"Tabular"}</span>
    ${[...tabsUsed].map(t=>`<span class="pill">${esc(t)}</span>`).join("")}
  </div>

  <div class="card">
    <div class="card-title">&#128203; Report briefing</div>
    <div style="font-size:13px;color:var(--muted);margin:.2rem 0 .5rem">Keep this open on a second screen while building in FranConnect, or share with your admin.</div>
    <div id="briefingBox">${S.briefingText}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:.75rem">
      <button class="copy-btn" id="copyBriefingBtn" onclick="copyBriefing()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Copy as plain text
      </button>
      <button class="copy-btn" onclick="printBriefing()" style="color:var(--text);border-color:var(--border-strong)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        Print briefing
      </button>
    </div>
  </div>`;
}

function copyBriefing() {
  const spec=S.spec||{}; const isAgg=spec.reportType==="aggregate";
  const cols=spec.columns||[]; const filters=spec.filters||[];
  const name=spec.reportName||"[name your report]";
  const tabsUsed=getTabsUsed(cols);
  const parts=["FRANCONNECT IM REPORT BRIEFING","Report name: "+name,"Type: "+(isAgg?"Aggregate (count)":"Tabular (list of locations)"),"Tabs used: "+[...tabsUsed].join(", "),""];
  if (isAgg) {
    const gb=spec.groupBy||{};
    parts.push("GROUP BY: "+gb.field+" (Tab: "+gb.tab+")");
  } else {
    parts.push("COLUMNS:");
    cols.forEach((c,i)=>parts.push("  "+(i+1)+". "+c.name+(c.tab?"  ["+c.tab+"]":"")));
  }
  parts.push("");
  if (filters.length) {
    parts.push("FILTERS (AND logic):");
    filters.forEach((f,i)=>{
      let s="  Filter "+(i+1)+":\n    Field: "+f.field+"\n    Tab: "+(f.tab||"")+"\n    Operator: "+f.operator;
      if(f.value)s+="\n    Value: "+f.value;
      if(f.warning)s+="\n    Note: "+f.warning;
      parts.push(s);
    });
  } else { parts.push("FILTERS: None"); }
  parts.push("","HOW TO BUILD:","1. Information Manager > Reports > Create New Report","2. Choose "+(isAgg?"Aggregation":"Tabular")+" > Next","3. Name: \""+name+"\"","4. Add filters (if any)","5. Add columns (navigate to each tab above)","6. NOTE: Max 5 tabs allowed per IM report","7. Click Modify to save");
  const textToCopy = parts.join("\n");
  function showCopied() {
    const btn = document.getElementById("copyBriefingBtn");
    if (btn) {
      btn.innerHTML = "&#10003; Copied!";
      setTimeout(() => {
        btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy as plain text';
      }, 2000);
    }
  }
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(textToCopy).then(showCopied).catch(() => fallbackCopy(textToCopy, showCopied));
  } else {
    fallbackCopy(textToCopy, showCopied);
  }
}

function printBriefing() {
  const el = document.getElementById("briefingBox");
  if (!el) return;
  // Inject a print-only stylesheet and trigger window.print()
  // Works on file://, http://, and https:// without needing a popup
  let printStyle = document.getElementById("printStyle");
  if (!printStyle) {
    printStyle = document.createElement("style");
    printStyle.id = "printStyle";
    document.head.appendChild(printStyle);
  }
  printStyle.textContent = `
    @media print {
      body > .page > .hdr,
      body > .page > div:not(:last-child),
      #briefingBox ~ * { display: none !important; }
      .col-status, .col-status-ok, .col-status-warn,
      .col-status-unknown, .col-suggestion { display: none !important; }
      body { background: #fff !important; padding: 1rem !important; }
      .briefing { border: 1px solid #E2E8F0 !important; border-radius: 8px !important; }
    }
  `;
  window.print();
  // Clean up after print dialog closes
  setTimeout(() => { printStyle.textContent = ""; }, 2000);
}

function resetAll(){
  S={view:"describe",description:"",spec:null,mockupData:null,briefingText:"",browserTab:"Center Info",browserVisible:false};
  render();
}

function fallbackCopy(text, callback) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.cssText = "position:fixed;top:-9999px;left:-9999px;opacity:0";
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try {
    document.execCommand("copy");
    if (callback) callback();
  } catch(e) {
    alert("Copy not supported in this browser — please select the briefing text and copy manually.");
  }
  document.body.removeChild(ta);
}


let _cannedExpanded = false;

function cannedRow(r) {
  const hasShot = r.screenshot && SCREENSHOTS[r.screenshot];
  const btn = hasShot
    ? `<button class="preview-btn" onclick="event.stopPropagation();openLightbox('${r.screenshot}','${r.name.replace(/'/g,"&#39;")}')">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        See what it looks like
      </button>`
    : "";
  const isOwners = r.id === "im4";
  const provNote = isOwners
    ? `<div style="font-size:11px;color:var(--fc-dark);background:var(--fc-light);border:1px solid var(--fc-border);border-radius:var(--rs);padding:3px 8px;margin-top:4px;display:inline-block">&#10003; May be pre-built in recently provisioned accounts &mdash; check Reports first</div>`
    : "";
  return `<div style="background:var(--bg);border:1px solid var(--border);border-radius:var(--rs);padding:8px 12px">
    <div style="font-size:13px;font-weight:500;color:var(--text)">${esc(r.name)}</div>
    <div style="font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4">${esc(r.desc)}</div>
    ${provNote}
    ${btn}
  </div>`;
}

function renderCannedList(expanded) {
  const cats = expanded ? CANNED_CATEGORIES : CANNED_CATEGORIES.slice(0, 2);
  return cats.map(cat => `
    <div style="margin-bottom:.85rem">
      <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:5px;padding-bottom:4px;border-bottom:1px solid var(--border)">${esc(cat.cat)}</div>
      <div style="display:flex;flex-direction:column;gap:5px">${cat.reports.map(r => cannedRow(r)).join("")}</div>
    </div>`).join("");
}

function toggleAllCanned() {
  _cannedExpanded = !_cannedExpanded;
  const el = document.getElementById("cannedList");
  const btn = document.getElementById("cannedToggle");
  if (el) el.innerHTML = renderCannedList(_cannedExpanded);
  if (btn) btn.textContent = _cannedExpanded ? "Show fewer" : "Show all categories";
}


function openLightbox(id, name) {
  const src = SCREENSHOTS[id];
  if (!src) return;
  document.getElementById("lbImg").src = src;
  document.getElementById("lbTitle").textContent = name;
  document.getElementById("lbOverlay").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeLightbox() {
  document.getElementById("lbOverlay").classList.remove("open");
  document.body.style.overflow = "";
}


render();
</script>
