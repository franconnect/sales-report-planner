<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FranConnect Leads Report Planner</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --fc:#185FA5;--fc-mid:#378ADD;--fc-light:#E6F1FB;--fc-border:#B5D4F4;--fc-dark:#0C447C;
  --bg:#F5F7FA;--surface:#fff;--border:#E2E8F0;--border-strong:#CBD5E1;
  --text:#1E293B;--muted:#64748B;--hint:#94A3B8;
  --green-bg:#EAF3DE;--green-text:#3B6D11;--green-border:#C0DD97;
  --amber-bg:#FAEEDA;--amber-text:#854F0B;--amber-border:#FAC775;
  --r:10px;--rs:6px;--rp:999px;
}
body{font-family:"DM Sans",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:2rem 1rem}
.page{max-width:760px;margin:0 auto}
.hdr{display:flex;align-items:center;gap:12px;margin-bottom:2rem}
.logo{background:var(--fc);color:#fff;font-size:11px;font-weight:600;letter-spacing:.08em;padding:5px 12px;border-radius:var(--rs);text-transform:uppercase;flex-shrink:0}
.hdr-title{font-size:20px;font-weight:600}
.hdr-sub{font-size:13px;color:var(--muted);margin-top:1px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.25rem 1.5rem;margin-bottom:1rem}
.card-title{font-size:15px;font-weight:600;margin-bottom:.4rem}
.help{background:var(--fc-light);border-left:3px solid var(--fc-mid);border-radius:0 var(--rs) var(--rs) 0;padding:9px 13px;font-size:13px;color:var(--fc-dark);line-height:1.6;margin:.6rem 0 1rem}
.help strong{font-weight:600}
.tip{background:#FAFAFA;border:1px solid var(--border);border-radius:var(--rs);padding:8px 12px;font-size:12px;color:var(--muted);line-height:1.55;margin-top:8px}
.tip strong{color:var(--text);font-weight:500}
.warn-box{background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:var(--rs);padding:8px 12px;font-size:12px;color:var(--amber-text);line-height:1.55;margin-top:4px}
textarea,input[type=text],select{font-family:"DM Sans",sans-serif;font-size:14px;color:var(--text);background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--rs);padding:7px 10px;width:100%;transition:border-color .15s}
textarea:focus,input[type=text]:focus,select:focus{outline:none;border-color:var(--fc-mid);box-shadow:0 0 0 3px rgba(55,138,221,.1)}
textarea{resize:vertical;line-height:1.55}
.btn{font-family:"DM Sans",sans-serif;font-size:14px;font-weight:500;border-radius:var(--rs);padding:8px 18px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--fc);color:#fff;border-color:var(--fc)}
.btn-primary:hover{background:var(--fc-dark)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--muted);border-color:var(--border-strong)}
.btn-ghost:hover{background:var(--bg);color:var(--text)}
.btn-sm{font-size:13px;padding:6px 12px}
.add-btn{font-size:13px;color:var(--fc);background:none;border:1px dashed var(--fc-mid);border-radius:var(--rs);padding:7px 12px;cursor:pointer;width:100%;text-align:left;font-family:"DM Sans",sans-serif;display:flex;align-items:center;gap:5px;margin-top:4px}
.add-btn:hover{background:var(--fc-light)}
.rmv{background:none;border:none;cursor:pointer;color:var(--hint);font-size:18px;line-height:1;padding:0;flex-shrink:0}
.rmv:hover{color:#E24B4A}
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:1rem}
.divider{border:none;border-top:1px solid var(--border);margin:1rem 0}
.sec-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}
.pill{display:inline-block;background:var(--fc-light);color:var(--fc-dark);border-radius:var(--rp);padding:3px 9px;font-size:12px;margin:2px 3px 2px 0;border:1px solid var(--fc-border)}
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:3px 9px;border-radius:var(--rp)}
.badge-tab{background:var(--green-bg);color:var(--green-text);border:1px solid var(--green-border)}
.badge-agg{background:var(--amber-bg);color:var(--amber-text);border:1px solid var(--amber-border)}
.chip{font-size:12px;padding:4px 11px;border:1px solid var(--border-strong);border-radius:var(--rp);cursor:pointer;color:var(--muted);background:var(--surface);transition:all .12s}
.chip:hover{background:var(--fc-light);border-color:var(--fc-mid);color:var(--fc-dark)}
.loading{padding:3rem;display:flex;flex-direction:column;align-items:center;gap:.85rem;color:var(--muted);font-size:14px;justify-content:center}
.spinner{width:22px;height:22px;border:2.5px solid var(--border-strong);border-top-color:var(--fc);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.mockup-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:1rem}
.mockup-bar{background:var(--fc);color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between}
.mockup-bar-name{font-size:14px;font-weight:600}
.mockup-bar-meta{font-size:11px;opacity:.7}
.mock-filter-bar{background:#F8FAFB;border-bottom:1px solid var(--border);padding:7px 14px;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.mock-filter-chip{background:var(--fc-light);color:var(--fc-dark);border:1px solid var(--fc-border);border-radius:var(--rp);padding:2px 9px;font-size:11px}
.mock-table-wrap{overflow-x:auto}
table.mock-table{width:100%;border-collapse:collapse;font-size:13px}
table.mock-table th{background:#F8FAFB;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:9px 14px;border-bottom:2px solid var(--border);text-align:left;white-space:nowrap}
table.mock-table td{padding:9px 14px;border-bottom:1px solid var(--border);color:var(--hint);white-space:nowrap;font-size:12px;font-style:italic}
table.mock-table tr:nth-child(even) td{background:#FAFBFC}
table.mock-table tr:last-child td{border-bottom:none}
.mock-footer{padding:8px 14px;font-size:12px;color:var(--muted);border-top:1px solid var(--border);background:#FAFAFA}
.agg-chart{padding:1.25rem 1.5rem}
.agg-chart-title{font-size:13px;font-weight:600;margin-bottom:1rem}
.bar-row{display:grid;grid-template-columns:160px 1fr 50px;gap:10px;align-items:center;margin-bottom:7px}
.bar-label{font-size:12px;color:var(--text);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{background:#F1F5F9;border-radius:var(--rp);height:20px;overflow:hidden}
.bar-fill{background:var(--fc-mid);height:100%;border-radius:var(--rp)}
.bar-val{font-size:12px;color:var(--muted);font-family:"DM Mono",monospace}
.briefing-box{background:#F8FAFB;border:1px solid var(--border);border-radius:var(--rs);padding:12px 14px;font-size:12.5px;color:var(--text);line-height:1.75;white-space:pre-wrap;font-family:"DM Mono",monospace;overflow-x:auto;margin-top:.75rem}
.copy-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--fc);background:none;border:1px solid var(--fc-border);border-radius:var(--rs);padding:6px 14px;cursor:pointer;margin-top:8px;font-family:"DM Sans",sans-serif;font-weight:500}
.copy-btn:hover{background:var(--fc-light)}
.preview-btn{font-size:11px;color:var(--fc);background:none;border:1px solid var(--fc-border);border-radius:var(--rp);padding:3px 9px;cursor:pointer;font-family:inherit;margin-top:5px;display:inline-flex;align-items:center;gap:4px}
.preview-btn:hover{background:var(--fc-light)}
.lb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:9999;align-items:center;justify-content:center;padding:1.5rem}
.lb-overlay.open{display:flex}
.lb-box{background:#fff;border-radius:10px;overflow:hidden;max-width:92vw;max-height:90vh;display:flex;flex-direction:column}
.lb-header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--fc);color:#fff}
.lb-title{font-size:14px;font-weight:600}
.lb-close{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;line-height:1;padding:0}
.lb-img-wrap{overflow:auto;flex:1}
.lb-img-wrap img{display:block;max-width:100%;height:auto}

.briefing{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-top:.75rem}
.bf-header{background:var(--fc);color:#fff;padding:10px 16px}
.bf-header-name{font-size:15px;font-weight:600}
.bf-header-meta{font-size:12px;opacity:.75;margin-top:2px;display:flex;gap:12px}
.bf-body{padding:1rem 1.25rem;display:flex;flex-direction:column;gap:1rem}
.bf-section{}
.bf-section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:.5rem;display:flex;align-items:center;gap:6px}
.bf-section-title::after{content:"";flex:1;height:1px;background:var(--border)}
.bf-row{display:grid;grid-template-columns:130px 1fr;gap:6px;align-items:baseline;margin-bottom:4px}
.bf-row-label{font-size:12px;font-weight:600;color:var(--muted)}
.bf-row-value{font-size:13px;color:var(--text);font-family:"DM Mono",monospace}
.bf-col-list{display:flex;flex-direction:column;gap:4px}
.bf-col-item{display:flex;align-items:baseline;gap:8px}
.bf-col-num{font-size:11px;color:var(--hint);font-family:"DM Mono",monospace;width:18px;text-align:right;flex-shrink:0}
.bf-col-name{font-size:13px;font-weight:500;color:var(--text)}
.bf-col-tab{font-size:11px;color:var(--hint);margin-left:4px}
.bf-filter-card{background:#F8FAFB;border:1px solid var(--border);border-radius:var(--rs);padding:9px 12px;display:flex;flex-direction:column;gap:4px}
.bf-filter-card.warn{background:#FFFBF0;border-color:var(--amber-border)}
.bf-filter-row{display:grid;grid-template-columns:80px 1fr;gap:4px;align-items:baseline}
.bf-filter-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.bf-filter-val{font-size:13px;color:var(--text);font-family:"DM Mono",monospace}
.bf-warn-msg{font-size:11px;color:var(--amber-text);display:flex;gap:5px;align-items:flex-start;margin-top:3px}
.bf-steps{display:flex;flex-direction:column;gap:5px;counter-reset:steps}
.bf-step{display:flex;gap:10px;align-items:flex-start}
.bf-step-num{width:22px;height:22px;border-radius:50%;background:var(--fc);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.bf-step-text{font-size:13px;color:var(--text);padding-top:2px;line-height:1.5}
.bf-step-text strong{font-weight:600;font-family:"DM Mono",monospace;color:var(--fc-dark)}
.bf-note{background:var(--fc-light);border:1px solid var(--fc-border);border-radius:var(--rs);padding:8px 12px;font-size:12px;color:var(--fc-dark);line-height:1.55}
.bf-note ul{margin-top:4px;padding-left:1rem}
.bf-note li{margin-bottom:2px}
.bf-instr{background:#F8FAFB;border:1px solid var(--border);border-radius:var(--rs);padding:8px 12px}
.bf-instr ul{padding-left:1.1rem;margin:0;display:flex;flex-direction:column;gap:3px}
.bf-instr li{font-size:12px;color:var(--muted);line-height:1.5}
.bf-instr li strong{color:var(--text);font-weight:500}
.bf-filter-and{font-size:11px;color:var(--hint);text-align:center;padding:2px 0;font-style:italic}

.col-status{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.col-status-ok{background:var(--green-bg);color:var(--green-text);border:1px solid var(--green-border)}
.col-status-warn{background:var(--amber-bg);color:var(--amber-text);border:1px solid var(--amber-border)}
.col-status-unknown{background:var(--red-bg);color:var(--red-text);border:1px solid var(--red-border)}
.col-suggestion{font-size:11px;color:var(--amber-text);margin-top:3px;padding:3px 8px;background:var(--amber-bg);border-radius:var(--rs);border:1px solid var(--amber-border);display:flex;align-items:center;gap:5px}
.col-suggestion button{font-size:11px;color:var(--fc);background:none;border:none;cursor:pointer;padding:0;font-family:inherit;font-weight:500;text-decoration:underline}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
<div class="page">
  <div class="hdr">
    <div class="logo">FranConnect</div>
    <div>
      <div class="hdr-title">Leads Report Planner</div>
      <div class="hdr-sub">Describe what you want &mdash; we&rsquo;ll build the report spec for you</div>
    </div>
  </div>
  <div id="app"></div>
</div>

<div class="lb-overlay" id="lbOverlay" onclick="if(event.target===this)closeLightbox()">
  <div class="lb-box">
    <div class="lb-header">
      <span class="lb-title" id="lbTitle"></span>
      <button class="lb-close" onclick="closeLightbox()">&times;</button>
    </div>
    <div class="lb-img-wrap"><img id="lbImg" src="" alt="Report screenshot"></div>
  </div>
</div>

<script>
// ── Screenshots (embedded) ───────────────────────────────────────────────────
const SCREENSHOTS = {

  'c29': 'https://raw.githubusercontent.com/franconnect/sales-report-planner/main/images/Email%20Subscription%20Report.png',
  'c2b': 'https://raw.githubusercontent.com/franconnect/sales-report-planner/main/images/Leads%20per%20Sales%20Territory%20Report.png',
  'c3': 'https://raw.githubusercontent.com/franconnect/sales-report-planner/main/images/Master%20Tracking%20by%20Lead%20Owner%20Report.png',
  'c4': 'https://raw.githubusercontent.com/franconnect/sales-report-planner/main/images/Lead%20Status%20Report.png',
  'c41': 'https://raw.githubusercontent.com/franconnect/sales-report-planner/main/images/Candidate%20Portal%20Report.png',
  'c42': 'https://raw.githubusercontent.com/franconnect/sales-report-planner/main/images/Candidate%20Portal%20Activity%20Report.png',
  'c5': 'https://raw.githubusercontent.com/franconnect/sales-report-planner/main/images/Closings%20by%20Source%20Report.png',
  'c6': 'https://raw.githubusercontent.com/franconnect/sales-report-planner/main/images/Lead%20Status%20Pipeline%20Report.png',
  'c7': 'https://raw.githubusercontent.com/franconnect/sales-report-planner/main/images/Killed%20Lead%20Analysis%20Report.png',
  'c8': 'https://raw.githubusercontent.com/franconnect/sales-report-planner/main/images/Sales%20Forecasting%20Report.png',
  'c9': 'https://raw.githubusercontent.com/franconnect/sales-report-planner/main/images/Closings%20by%20Owner%20Report.png',
};


// ── Field knowledge base ─────────────────────────────────────────────────────
const FIELD_KNOWLEDGE = `
FranConnect Sales Module — exact field labels, tabs, and known values:

PRIMARY INFO > Contact Information:
  First Name (Text), Last Name (Text), Inquiry Date (Date, auto-set on entry),
  Email (Text), Mobile (Text — this is the cell/mobile field),
  Work Phone (Text), Home Phone (Text),
  City (Text), State / Province (dropdown), Country (dropdown), Zip / Postal Code (Text)

PRIMARY INFO > Lead Details:
  Lead Status (Dropdown) — VALUES ARE CUSTOMIZED PER ACCOUNT, do not assume defaults
  Lead Owner (Dropdown) — the assigned sales rep
  Lead Source Category (Dropdown) — values: Advertisement, Brokers, Import, Internet, Referred by, Search
  Lead Source Details (Dropdown) — DEPENDENT on Category; must pick Category first.
    Internet details include: FranchiseGator, Franchise Direct Lead, Entrepreneur.com,
    Website, FranchiseOnline.com, BeTheBoss, Boefly, franchise.org, and many others.
    Advertisement details: Magazine, Newspaper, Trade Shows, Other
    Search details: Google, Yahoo, MSN, Other
    Referred by details: Friend, Family, Co-workers
  Cash Available for Investment (Text)
  Current Net Worth (Text)
  Investment Timeframe (Dropdown) — values vary by account
  Lead Rating (Dropdown) — Hot, Warm, Cold, None
  Franchise Awarded (Checkbox)
  Next Call Date (Date)
  Marketing Code (Dropdown)

IMPORTANT — Lead Source Details dependency:
  Filtering by Lead Source Details REQUIRES a Lead Source Category filter first.
  Always output TWO filter rows: Category first, then Details.
  Example: "leads from FranchiseGator" = [Category=Internet] AND [Details=FranchiseGator]
  This is the same pattern as Country/State — country must be set before state populates.

Filter operators available:
  equals, does not equal, contains, is (one of), is greater than, is less than,
  is before, is after, is in this month, is in last month, is in this year,
  is in last year, is in the last 7 days, is empty, is not empty
`;

// ── Standard reports ─────────────────────────────────────────────────────────
const CANNED_CATEGORIES = [
  { cat: "Lead Count Reports", reports: [
    {id:"c10", screenshot:"c10", name:"Leads per Month Report",                    desc:"Monthly breakdown of lead totals by owner. Look for seasonality and trends."},

  ]},

  ]},
  { cat: "Lead Owner Based Reports", reports: [
    {id:"c1",  screenshot:"c1",  name:"Leads by Owner and Status Report",          desc:"See how each rep is moving leads through the pipeline. Compare workload and performance."},
    {id:"c8",  screenshot:"c8",  name:"Sales Forecasting Report",                  desc:"What deals are due to close and when, by rep? Shows forecast date, probability, and weighted revenue."},
    {id:"c15", screenshot:"c15",  name:"Sales Owner Performance Analysis Report",   desc:"Historical view of how many leads each owner moved through each milestone."},
    {id:"c3",  screenshot:"c3",  name:"Master Tracking By Lead Owner",             desc:"How many leads made it through each funnel stage by owner? Identify problem stages."}
  ]},
  { cat: "Lead to Franchise Conversion Reports", reports: [
    {id:"c16", screenshot:"c16",  name:"Closings per Month Report",                 desc:"Year-over-year comparison of new and closed leads by month."},
    {id:"c9",  screenshot:"c9",  name:"Closings by Owner Report",                  desc:"Compare new, active, and closed deals per rep."},
    {id:"c5",  screenshot:"c5",  name:"Closings by Source Report",                 desc:"Which sources produce actual closed deals? Influence marketing spend with this."},
    {id:"c17", screenshot:null,  name:"Lead Conversion by Brokers Report",         desc:"Which brokers send the best leads? Compare broker pool performance."},
    {id:"c12", screenshot:"c12",  name:"Marketing Costs ROI Analysis Report",       desc:"Cost per lead and cost per closed deal by source."},
    {id:"c18", screenshot:"c18",  name:"# of Locations Sold per Lead Report",       desc:"Track multi-unit deal volume."},
    {id:"c19", screenshot:null,  name:"Franchise Agreement Fee Collection Report", desc:"Initial franchise payment fee collection from leads."}

// ── File upload handling ──────────────────────────────────────────────────────
async function handleFileSelect(file) {
  if (!file) return;
  await processFile(file);
}

async function handleFileDrop(file) {
  if (!file) return;
  await processFile(file);
}

async function processFile(file) {
  const name = file.name;
  const ext = name.split('.').pop().toLowerCase();
  const imageTypes = ['png','jpg','jpeg','gif','webp'];
  const mediaTypeMap = {'png':'image/png','jpg':'image/jpeg','jpeg':'image/jpeg','gif':'image/gif','webp':'image/webp'};

  const dz = document.getElementById('dropZone');
  if (dz) dz.innerHTML = '<div style="font-size:13px;color:var(--muted)">Reading file&hellip;</div>';

  try {
    if (imageTypes.includes(ext)) {
      const b64 = await fileToBase64(file);
      S.uploadContent = {type:'image', data:b64, mediaType:mediaTypeMap[ext]||'image/png', fileName:name};

    } else if (ext === 'pdf') {
      const b64 = await fileToBase64(file);
      S.uploadContent = {type:'document', data:b64, mediaType:'application/pdf', fileName:name};

    } else if (['xlsx','xls'].includes(ext)) {
      const text = await readExcelAsText(file);
      S.uploadContent = {type:'text', data:text, fileName:name};

    } else if (ext === 'csv') {
      const text = await readTextFile(file);
      S.uploadContent = {type:'text', data:text, fileName:name};

    } else if (['docx','doc'].includes(ext)) {
      const text = await readDocxAsText(file);
      S.uploadContent = {type:'text', data:text, fileName:name};

    } else {
      const text = await readTextFile(file);
      S.uploadContent = {type:'text', data:text, fileName:name};
    }
  } catch(e) {
    S.uploadContent = null;
    console.error('processFile error:', e);
    alert('Could not read file: ' + e.message);
  }
  // Always re-enable the button if upload succeeded
  const btn = document.getElementById('interpBtn');
  if (btn) btn.disabled = !S.uploadContent;
  render();
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result.split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

function readTextFile(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsText(file);
  });
}

async function readExcelAsText(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = async (e) => {
      try {
        // First try SheetJS if available
        if (window.XLSX) {
          const wb = XLSX.read(e.target.result, {type:'array'});
          let out = '';
          wb.SheetNames.forEach(sname => {
            const ws = wb.Sheets[sname];
            out += 'Sheet: ' + sname + '\n' + XLSX.utils.sheet_to_csv(ws) + '\n\n';
          });
          resolve(out.slice(0, 12000));
          return;
        }
        // Fallback: use JSZip to extract sharedStrings.xml and sheet data
        if (window.JSZip) {
          const zip = await JSZip.loadAsync(e.target.result);
          let text = '';
          // Get shared strings (the actual cell text values)
          const ssFile = zip.file('xl/sharedStrings.xml');
          if (ssFile) {
            const xml = await ssFile.async('string');
            // Extract text content from <t> tags
            const matches = xml.match(/<t[^>]*>([^<]+)<\/t>/g) || [];
            const strings = matches.map(m => m.replace(/<[^>]+>/g, ''));
            text += strings.join('\t') + '\n';
          }
          // Also try to get sheet1 data for structure
          const sheetFile = zip.file('xl/worksheets/sheet1.xml');
          if (sheetFile) {
            const xml = await sheetFile.async('string');
            // Extract cell values
            const vals = xml.match(/<v>([^<]+)<\/v>/g) || [];
            text += vals.map(v => v.replace(/<[^>]+>/g, '')).join('\t') + '\n';
          }
          resolve(text.slice(0, 12000));
          return;
        }
        // Last resort: binary ASCII extraction
        const arr = new Uint8Array(e.target.result);
        let out = '', cur = '';
        for (let i = 0; i < arr.length; i++) {
          const c = arr[i];
          if (c >= 32 && c < 127) { cur += String.fromCharCode(c); }
          else { if (cur.length > 3) out += cur + '\t'; cur = ''; }
        }
        resolve(out.slice(0, 12000));
      } catch(err) {
        console.error('readExcelAsText error:', err);
        reject(err);
      }
    };
    r.onerror = reject;
    r.readAsArrayBuffer(file);
  });
}

async function readDocxAsText(file) {
  // DOCX is a ZIP — extract word/document.xml and strip tags
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = async (e) => {
      try {
        // Use JSZip if available
        if (window.JSZip) {
          const zip = await JSZip.loadAsync(e.target.result);
          const xmlFile = zip.file('word/document.xml');
          if (!xmlFile) { resolve('(could not read document.xml)'); return; }
          const xml = await xmlFile.async('string');
          // Strip XML tags, decode common entities, collapse whitespace
          const text = xml
            .replace(/<w:p[ >]/g, '\n<w:p>')   // paragraph breaks
            .replace(/<[^>]+>/g, '')            // strip all tags
            .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>')
            .replace(/&nbsp;/g,' ').replace(/&#x[0-9A-F]+;/gi,'')
            .replace(/[ \t]+/g,' ')
            .trim();
          resolve(text.slice(0, 12000));
        } else {
          // Fallback: read as binary and extract text runs
          const arr = new Uint8Array(e.target.result);
          // Look for UTF-16 text between XML tags in the ZIP
          let text = '';
          const decoder = new TextDecoder('utf-8', {fatal:false});
          // Try reading as UTF-8 and stripping tags
          const raw = decoder.decode(arr);
          const stripped = raw.replace(/<[^>]+>/g,'').replace(/[^\x20-\x7E\n]/g,' ').replace(/\s+/g,' ');
          resolve(stripped.slice(0, 12000));
        }
      } catch(err) { reject(err); }
    };
    r.onerror = reject;
    r.readAsArrayBuffer(file);
  });
}

// Flatten all known Sales fields into a searchable list
function getSalesFieldList() {
  const list = [];
  const COMMON = ["First Name","Last Name","Inquiry Date","Email","Mobile","Work Phone","Home Phone",
    "City","State / Province","Country","Zip / Postal Code"];
  COMMON.forEach(n => list.push({name:n, tab:"Primary Info > Contact Information"}));
  [
    {name:"Lead Status",tab:"Primary Info > Lead Details"},
    {name:"Lead Owner",tab:"Primary Info > Lead Details"},
    {name:"Lead Source Category",tab:"Primary Info > Lead Details"},
    {name:"Lead Source Details",tab:"Primary Info > Lead Details"},
    {name:"Cash Available for Investment",tab:"Primary Info > Lead Details"},
    {name:"Current Net Worth",tab:"Primary Info > Lead Details"},
    {name:"Investment Timeframe",tab:"Primary Info > Lead Details"},
    {name:"Lead Rating",tab:"Primary Info > Lead Details"},
    {name:"Franchise Awarded",tab:"Primary Info > Lead Details"},
    {name:"Next Call Date",tab:"Primary Info > Lead Details"},
    {name:"Marketing Code",tab:"Primary Info > Lead Details"},
    {name:"Sales Person",tab:"Primary Info > Lead Details"},
    {name:"Heat Index",tab:"Qualification Details > Internal Analysis"},
    {name:"Cash Available for Investment",tab:"Qualification Details > Internal Analysis"},
    {name:"Current Net Worth",tab:"Qualification Details > Internal Analysis"},
    {name:"Investment Timeframe",tab:"Qualification Details > Internal Analysis"},
    {name:"Background Check Approval",tab:"Qualification Details > Internal Analysis"},
    {name:"Employment Background",tab:"Qualification Details > Internal Analysis"},
  ].forEach(f => list.push(f));
  return list;
}

function fuzzyMatch(fieldName, fieldList) {
  if (!fieldName) return null;
  const q = fieldName.toLowerCase().trim();
  // Exact match
  const exact = fieldList.find(f => f.name.toLowerCase() === q);
  if (exact) return {match: exact, score: 1.0};
  // Contains match
  const contains = fieldList.filter(f => f.name.toLowerCase().includes(q) || q.includes(f.name.toLowerCase()));
  if (contains.length) return {match: contains[0], score: 0.8};
  // Word overlap
  const qWords = q.split(/\s+/);
  let best = null, bestScore = 0;
  fieldList.forEach(f => {
    const fWords = f.name.toLowerCase().split(/\s+/);
    const overlap = qWords.filter(w => w.length > 2 && fWords.some(fw => fw.includes(w) || w.includes(fw))).length;
    const score = overlap / Math.max(qWords.length, fWords.length);
    if (score > bestScore) { bestScore = score; best = f; }
  });
  if (bestScore > 0.3) return {match: best, score: bestScore};
  return null;
}

function getColStatus(col) {
  const list = getSalesFieldList();
  const exact = list.find(f => f.name.toLowerCase() === (col.name||"").toLowerCase().trim());
  if (exact) return {status:"ok", suggestion:null};
  if (col.confident === false) {
    const fm = fuzzyMatch(col.name, list);
    return {status:"warn", suggestion: fm ? fm.match : null};
  }
  // Not confident:false but also not in dict — check dictionary
  const fm = fuzzyMatch(col.name, list);
  if (!fm || fm.score < 0.5) return {status:"unknown", suggestion: fm ? fm.match : null};
  return {status:"ok", suggestion:null}; // close enough
}

function colRow(col, i) {
  const locked = i < 3;
  const {status, suggestion} = locked ? {status:"ok",suggestion:null} : getColStatus(col);
  const statusIcon = status === "ok"
    ? `<div class="col-status col-status-ok" title="Field recognized">✓</div>`
    : status === "warn"
    ? `<div class="col-status col-status-warn" title="Field uncertain — verify name">⚠</div>`
    : `<div class="col-status col-status-unknown" title="Field not recognized">?</div>`;

  const suggestionHTML = (!locked && status !== "ok" && suggestion)
    ? `<div class="col-suggestion">
        Did you mean: <button onclick="S.spec.columns[${i}].name='${suggestion.name.replace(/'/,"\\'")}';S.spec.columns[${i}].tab='${suggestion.tab.replace(/'/,"\\'")}';S.spec.columns[${i}].confident=true;rerenderCols()">${esc(suggestion.name)}</button>
        <span style="opacity:.7">(${esc(suggestion.tab)})</span>
      </div>`
    : (!locked && status === "unknown" && !suggestion)
    ? `<div class="col-suggestion">⚠ Could not find this field — open a lead record in FranConnect and copy the label exactly.</div>`
    : "";

  return `<div style="margin-bottom:${suggestionHTML?'4px':'2px'}">
    <div style="display:grid;grid-template-columns:20px 1fr auto 26px;gap:6px;align-items:center">
      ${statusIcon}
      <input type="text" value="${esc(col.name)}" oninput="S.spec.columns[${i}].name=this.value" onblur="rerenderCols()" placeholder="Field name"
        ${locked ? 'readonly style="background:#F8FAFB;color:var(--muted)"' : ""}
        style="border-color:${status==='unknown'?'var(--red-border)':status==='warn'?'var(--amber-border)':''}">
      <span style="font-size:11px;color:var(--hint);white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis" title="${esc(col.tab||"")}">${esc(col.tab||"")}</span>
      ${locked
        ? '<span></span>'
        : `<button class="rmv" onclick="S.spec.columns.splice(${i},1);rerenderCols()" aria-label="Remove">&times;</button>`}
    </div>
    ${suggestionHTML}
  </div>`;
}

function rerenderCols() {
  const el = document.getElementById("colRows");
  if (el) el.innerHTML = (S.spec.columns||[]).map((c,i) => colRow(c,i)).join("");
}

async function generate() {
  S.view = "generating";
  S.mockupData = null;
  S.briefingText = "";
  render();

  const spec = S.spec;
  const isAgg = spec.reportType === "aggregate";

  const [mockup, briefing] = await Promise.all([
    buildMockup(isAgg, spec),
    Promise.resolve(buildBriefing(isAgg, spec))
  ]);

  S.mockupData = mockup;
  S.briefingText = briefing;
  S.view = "mockup";
  render();
}

async function buildMockup(isAgg, spec) {
  if (!isAgg) {
    return {
      type: "tabular",
      columns: (spec.columns||[]).map(c => c.name).filter(Boolean),
      filters: (spec.filters||[]).filter(f => f.field)
    };
  }
  try {
    const res = await fetch("https://fc-api-proxy.vercel.app/api/anthropic", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 500,
        system: "Return ONLY valid JSON. No markdown.",
        messages: [{role: "user", content: `Generate realistic franchise industry aggregate report data for a FranConnect leads report.
Group by: "${spec.groupBy}"
Return JSON: {"rows":[{"label":"...","count":42},...], "maxCount":123}
Use 5-8 rows with realistic values for "${spec.groupBy}".`}]
      })
    });
    const data = await res.json();
    const raw = (data.content?.find(b => b.type === "text")?.text || "{}").replace(/```[a-z]*|```/g, "").trim();
    return {type: "aggregate", ...JSON.parse(raw)};
  } catch(e) {
    return {type: "aggregate", rows:[{label:"(preview unavailable)",count:0}], maxCount:1};
  }
}

    out += `<div style="display:flex;flex-direction:column;gap:6px">`;
    filters.forEach((f, i) => {
      const noVal = ["is empty","is not empty","is in this month","is in last month","is in this year","is in last year","is in the last 7 days"].includes(f.operator);

  out += `</div></div>`;
  return out;

      </tbody></table>
    </div>
    <div class="mock-footer">Column headers are yours &mdash; rows show where your real lead data will appear.</div>`;
  }

  const badgeCols = isAgg ? (spec.groupBy ? [spec.groupBy] : []) : (data?.columns||[]);

  return `
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem;flex-wrap:wrap;gap:8px">
    <div>
      <div style="font-size:16px;font-weight:600">Your report</div>
      <div style="font-size:13px;color:var(--muted);margin-top:2px">Use the briefing below to build this in FranConnect.</div>
    </div>
    <div style="display:flex;gap:7px">
      <button class="btn btn-ghost btn-sm" onclick="S.view='review';render()">&#8592; Edit spec</button>
      <button class="btn btn-ghost btn-sm" onclick="S.view='describe';S.description='';S.spec=null;render()">Start over</button>
    </div>
  </div>

  <div class="mockup-wrap">
    <div class="mockup-bar">
      <span class="mockup-bar-name">${esc(name)}</span>
      <span class="mockup-bar-meta">Sales &middot; ${isAgg ? "Aggregate &middot; Sample data" : "Tabular &middot; Column preview"}</span>
    </div>
    ${mockHtml}
  </div>

  <div style="display:flex;gap:7px;margin-bottom:1rem;flex-wrap:wrap;align-items:center">
    <span class="badge ${isAgg ? "badge-agg" : "badge-tab"}">${isAgg ? "Aggregate" : "Tabular"}</span>
    ${badgeCols.filter(Boolean).map(c => `<span class="pill">${esc(c)}</span>`).join("")}
  </div>

  <div class="card">
    <div class="card-title">&#128203; Report briefing</div>
    <div style="font-size:13px;color:var(--muted);margin:.2rem 0 .5rem">Keep this open on a second screen while building in FranConnect, or share it with your admin.</div>
    <div id="briefingBox">${S.briefingText}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:.75rem">
      <button class="copy-btn" id="copyBriefingBtn" onclick="copyBriefing()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Copy as plain text
      </button>
      <button class="copy-btn" onclick="printBriefing()" style="color:var(--text);border-color:var(--border-strong)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        Print briefing
      </button>
    </div>
  </div>`;
}

function copyBriefing() {
  const spec = S.spec || {};
  const isAgg = spec.reportType === "aggregate";
  const cols = spec.columns || [];
  const filters = spec.filters || [];
  const name = spec.reportName || "[name your report]";

  const colLines = cols.map((c,i) => "  " + (i+1) + ". " + c.name + (c.tab ? "  [" + c.tab + "]" : "")).join("\n");
  const filterLines = filters.map((f,i) => {
    let s = "  Filter " + (i+1) + ":\n    Field: " + f.field + "\n    Operator: " + f.operator;
    if (f.value) s += "\n    Value: " + f.value;
    if (f.warning) s += "\n    Note: " + f.warning;
    return s;
  }).join("\n");

  const parts = [
    "FRANCONNECT LEADS REPORT BRIEFING",
    "Report name: " + name,
    "Type: " + (isAgg ? "Aggregate (count)" : "Tabular (list)")
  ];
  if (S.description) parts.push("Based on: \"" + S.description + "\"");
  parts.push("");
  if (isAgg) {
    parts.push("GROUP BY: " + (spec.groupBy || "[not set]"));
  } else {
    parts.push("COLUMNS:");
    parts.push(colLines);
  }
  parts.push("");
  if (filters.length) {
    parts.push("FILTERS (AND logic):");
    parts.push(filterLines);
  } else {
    parts.push("FILTERS: None");
  }
  parts.push("");
  parts.push("HOW TO BUILD:");
  parts.push("1. Sales > Reports > Custom Reports");
  parts.push("2. Create New Report > " + (isAgg ? "Aggregation" : "Tabular"));
  parts.push("3. Name: \"" + name + "\"");
  parts.push("4. Visibility: Private");
  parts.push(filters.length ? "5. Add filters (see above)" : "5. Skip filters");
  if (isAgg) {
    parts.push("6. Group By: " + (spec.groupBy || ""));
    parts.push("7. Display Summaries: Count");
    parts.push("8. Click Modify to save");
  } else {
    parts.push("6. Add columns (see list above)");
    parts.push("7. Click Modify to save");
  }

    const textToCopy = parts.join("\n");
  function showCopied() {
    const btn = document.getElementById("copyBriefingBtn");
    if (btn) {
      btn.innerHTML = "&#10003; Copied!";
      setTimeout(() => {
        btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy as plain text';
      }, 2000);
    }
  }
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(textToCopy).then(showCopied).catch(() => fallbackCopy(textToCopy, showCopied));
  } else {
    fallbackCopy(textToCopy, showCopied);
  }
}
function printBriefing() {
  const el = document.getElementById("briefingBox");
  if (!el) return;
  // Inject a print-only stylesheet and trigger window.print()
  // Works on file://, http://, and https:// without needing a popup
  let printStyle = document.getElementById("printStyle");
  if (!printStyle) {
    printStyle = document.createElement("style");
    printStyle.id = "printStyle";
    document.head.appendChild(printStyle);
  }
  printStyle.textContent = `
    @media print {
      body > .page > .hdr,
      body > .page > div:not(:last-child),
      #briefingBox ~ * { display: none !important; }
      .col-status, .col-status-ok, .col-status-warn,
      .col-status-unknown, .col-suggestion { display: none !important; }
      body { background: #fff !important; padding: 1rem !important; }
      .briefing { border: 1px solid #E2E8F0 !important; border-radius: 8px !important; }
    }
  `;
  window.print();
  // Clean up after print dialog closes
  setTimeout(() => { printStyle.textContent = ""; }, 2000);
}

function fallbackCopy(text, callback) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.cssText = "position:fixed;top:-9999px;left:-9999px;opacity:0";
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try {
    document.execCommand("copy");
    if (callback) callback();
  } catch(e) {
    alert("Copy not supported in this browser — please select the briefing text and copy manually.");
  }
  document.body.removeChild(ta);
}


render();
</script>
</body>
</html>
